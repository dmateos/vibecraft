[package]
name = "vibecraft"
version = "0.1.0"
edition = "2024"
default-run = "vibecraft"

[dependencies]
bevy = "0.14.2"
noise = "0.9"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
